[sqlserver]
# Network configuration
tcp_enabled = true
tcp_port = 1433

# Memory settings
max_server_memory = 2147483648   # 2GB, adjust based on your server's capacity
min_server_memory = 134217728    # 128MB, adjust as necessary

# Authentication mode
authentication_mode = Mixed

# SQL Server agent settings (optional)
sqlagent_enabled = true

# Error log settings
errorlog = /var/opt/mssql/log/errorlog

# TempDB configuration
tempdb_size = 1024MB
tempdb_growth = 128MB

# Enable SQLCLR (for .NET integration, optional)
clr_enabled = true

# SQL Server version settings (Optional, usually for troubleshooting)
sql_server_version = 2019