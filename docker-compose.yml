services:
  db:
    build:
      context: db
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", 'sqlcmd -U sa -d master -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - sqlserverdata:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DBPASSWORD}
      - MSSQL_PID=Developer
      - MSSQL_USER=${DBUSERID}
      - MSSQL_PASSWORD=${DBPASSWORD}
      - SQLCMDPASSWORD=${DBPASSWORD}

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - wwwroot:/app/wwwroot
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=${DBSERVER};Database=${DBDATABASE};User Id=${DBUSERID};Password=${DBPASSWORD};Encrypt=False;TrustServerCertificate=True
      - Jwt__Key=${JWTKEY}
      - Jwt__Issuer=${JWTISSUER}
      - Jwt__Audience=${JWTAUDIENCE}
      - Authentication__Google__ClientId=${GOOGLECLIENTID}
      - Authentication__Google__ClientSecret=${GOOGLECLIENTSECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLEAPIKEY}
    working_dir: /src
    depends_on:
      db: 
        condition: service_healthy
    networks:
      - cocktail-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    working_dir: /app
    command: npm run start -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - cocktail-net
    restart: always

  nginx:
    build: 
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    volumes:
      - wwwroot:/app/wwwroot
    ports:
      - "8081:80"
    depends_on:
      - frontend
      - backend
    networks:
      - cocktail-net
    restart: always

volumes:
  sqlserverdata:

  wwwroot:
  

networks:
  cocktail-net:
    driver: bridge
