services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest-arm64
    container_name: sqlserver
    environment:
      SA_PASSWORD: ${DBPASSWORD}
      ACCEPT_EULA: "Y"
    networks:
      - cocktail-net
    restart: always

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - wwwroot:/app/wwwroot
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=${DBSERVER};Database=${DBDATABASE};User Id=${DBUSERID};Password=${DBPASSWORD};Encrypt=False;TrustServerCertificate=True
      - Jwt__Key=${JWTKEY}
      - Jwt__Issuer=${JWTISSUER}
      - Jwt__Audience=${JWTAUDIENCE}
      - Authentication__Google__ClientId=${GOOGLECLIENTID}
      - Authentication__Google__ClientSecret=${GOOGLECLIENTSECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLEAPIKEY}
    working_dir: /src
    depends_on:
      - db
    networks:
      - cocktail-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    working_dir: /app
    command: npm run start -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - cocktail-net
    restart: always

  nginx:
    build: 
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx
    volumes:
      - wwwroot:/app/wwwroot
    ports:
      - "8081:80"
    depends_on:
      - frontend
      - backend
    networks:
      - cocktail-net
    restart: always

volumes:
  sqlserverdata:

  wwwroot:
  

networks:
  cocktail-net:
    driver: bridge
